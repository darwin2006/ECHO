services:
  - type: web
    name: echo-backend
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: CORS_ORIGINS
        value: "*"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
